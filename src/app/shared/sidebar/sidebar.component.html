<!-- sidebar.component.html -->
<div class="sidebar">
  <h2>{{ title }}</h2>

  <ul>
    <li *ngFor="let item of items">
      {{ item.name }}
      <ul>
        <li *ngFor="let subItem of item.subItems">{{ subItem }}</li>
      </ul>
    </li>
  </ul>
</div>
