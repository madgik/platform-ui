<div class="accordion">
  <div class="accordion-header" (click)="toggleAccordion('filters')">
    <span>Filters Panel</span>
    <i class="fas fa-chevron-down"></i>
  </div>
  <div class="accordion-content" [ngClass]="{'open': isAccordionOpen('filters')}">
    <h3>Apply a Filter</h3>
    <ul>
      <li *ngFor="let filter of filters">
        <button (click)="applyFilter(filter)">{{ filter }}</button>
      </li>
    </ul>
  </div>
</div>
