<app-accordion [accordionTitle]=accordionTitle>
  <div class="accordion-content">
    <h3>Apply a Filter</h3>
    <ul>
      @for (filter of filters; track filter) {
        <li>
          <button (click)="applyFilter(filter)">{{ filter }}</button>
        </li>
      }
    </ul>
  </div>
</app-accordion>
