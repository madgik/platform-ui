<!-- Distribution Graph Component -->
<div class="distribution-graph-expanded">
  <div class="distribution-graph-full">
    @if (data && data.bins && data.counts) {
    <app-histogram
      [data]="data"
      [config]="{ color: '#00a6c0' }"
    ></app-histogram>
    } @else {
    <div class="no-data-message">
      <h3> Please select a Variable</h3>
    </div>
    }

    <!-- Floating Button -->
    <button
      class="floating-button"
      aria-label="Open Statistical Analysis"
      (click)="openStatisticalAnalysis()"
    >
      <i class="fa fa-chart-line"></i>
    </button>
  </div>
</div>

<!-- Load Statistical Analysis Panel Component -->
@if (isStatisticalAnalysisOpen()) {
  <app-statistic-analysis-panel
  [processedData]="processedData"
  (close)="closeStatisticalAnalysis()">
</app-statistic-analysis-panel>
}
