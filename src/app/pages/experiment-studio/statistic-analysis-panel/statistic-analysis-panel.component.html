<div class="accordion">
  <div class="accordion-header" (click)="toggleAccordion('statistics')">
    <span>Statistic Analysis Panel</span>
    <i class="fas fa-chevron-down"></i>
  </div>
  <div class="accordion-content" [ngClass]="{'open': isAccordionOpen('statistics')}">
    <h3>Statistical Analysis</h3>
    <ul>
      <li *ngFor="let stat of statistics">
        <strong>{{ stat.title }}:</strong> {{ stat.value }}
      </li>
    </ul>
  </div>
</div>
