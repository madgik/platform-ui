<div class="dataset-selector">
  <button class="dataset-btn" (click)="toggleDropdown()">
    <span class="dataset-btn-label">Select Datasets</span>
  </button>

  <!-- Counter badge -->
  <span class="dataset-counter">{{ selectedDatasets.size }}</span>

  <!-- Dropdown menu -->
  @if (isDropdownOpen) {
    <ul class="dataset-dropdown-menu">
      @for (dataset of datasets; track dataset) {
        <li>
          <label>
            <input
              type="checkbox"
              [checked]="isDatasetSelected(dataset.code)"
              (change)="toggleDataset(dataset.code)"
            />
            {{ dataset.label }}
          </label>
        </li>
      }
    </ul>
  }
</div>
