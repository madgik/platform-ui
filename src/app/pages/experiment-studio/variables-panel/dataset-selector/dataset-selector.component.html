<div class="button-container">
  <button class="variable-btn" (click)="toggleDropdown()">
    Select Datasets
  </button>

  <!-- Counter badge -->
  <span class="counter">{{ selectedDatasets.size }}</span>

  <!-- Dropdown menu -->
  @if (isDropdownOpen) {
    <ul class="dropdown-menu">
      @for (dataset of datasets; track dataset) {
        <li>
          <label>
            <input
              type="checkbox"
              [checked]="isDatasetSelected(dataset.code)"
              (change)="toggleDataset(dataset.code)"
            />
            {{ dataset.label }}
          </label>
        </li>
      }
    </ul>
  }
</div>
