<div class="variables-panel-shell">
  <div class="panel-header">
    <p>Variables and Covariates</p>
  </div>

  <div class="selectors-row">
  <app-data-model-selector
    [crossSectionalModels]="crossSectionalModels"
    [longitudinalModels]="longitudinalModels"
    [defaultModel]="selectedDataModel()!"
    (dataModelChange)="onSelectedDataModelChange($event)"
  >
  </app-data-model-selector>

  <app-dataset-selector [datasets]="availableDatasets">
  </app-dataset-selector>

  <div class="search-bar-container">
    @if (d3Data) {
    <app-search-bar
      [dataModelHierarchy]="d3Data"
      (searchResultSelected)="onSearchSelected($event)"
    ></app-search-bar>
    }
  </div>
  </div>

  <!-- Main area: Bubble + Right column -->
  <div class="variables-main">
    <!-- Bubble Chart -->
    <div class="bubble-chart-section">
      @if (selectedDataModel()) {
      <app-bubble-chart
        [d3Data]="d3Data"
        [highlightNode]="highlightNode"
        [selectedVariables]="selectedVariables"
        [selectedCovariates]="selectedCovariates"
        [selectedFilters]="selectedFilters"
        (selectedNodeChange)="onSelectedNodeChange($event)"
      >
      </app-bubble-chart>
      }
    </div>

    <!-- Right column: parameters + distribution -->
    <div class="right-column">
      <section class="panel-block variable-filter-container">
        <app-variable-filter-selection
          [selectedNode]="selectedNode"
          (filtersChange)="onFilterChange($event)"
          (variableClicked)="onVariableClicked($event)"
        ></app-variable-filter-selection>
      </section>

      <div class="histogam-placeholder">
        <section class="panel-block distribution-graph">
          <p class="distribution-graph-header">Distribution Graph</p>

          @if (isLoadingHistogram()) {
          <div class="distribution-loader">
            <app-spinner text="Loading Histogram" [overlay]="false" />
          </div>
          } @else if (errorMessage()) {
          <div class="message-container error">
            <p>{{ errorMessage() }}</p>
          </div>
          } @else if (!selectedNode) {
          <div class="message-container info">
            <p>Please select a variable to view its distribution.</p>
          </div>
          } @else if (distributionData()) {
          <app-distribution-graph
            [data]="distributionData()"
          ></app-distribution-graph>
          }
        </section>

      </div>
    </div>
  </div>
</div>
