<app-accordion [accordionTitle]="accordionTitle">
  <div class="selectors-container">
    <app-data-model-selector
      [crossSectionalModels]="crossSectionalModels"
      [longitudinalModels]="longitudinalModels"
      [defaultModel]="selectedDataModel!"
      (dataModelChange)="onSelectedDataModelChange($event)"
    >
    </app-data-model-selector>

    <app-dataset-selector
      [datasets]="availableDatasets"
      (selectedDatasetsChange)="onDatasetsSelected($event)"
    >
    </app-dataset-selector>

    <div id="search-bar-container">
      @if (d3Data) {
        <app-search-bar
          [dataModelHierarchy]="d3Data"
          (searchResultSelected)="onSearchResult($event)"
        ></app-search-bar>
      }
    </div>
  </div>

  <div class="variables-panel-container">
    <!-- Bubble Chart -->
    <div class="bubble-chart-section">
      @if (selectedDataModel) {
      <app-bubble-chart
        [d3Data]="d3Data"
        [highlightNode]="highlightNode"
        (selectedNodeChange)="onSelectedNodeChange($event)"
      >
      </app-bubble-chart>
      }
    </div>
    <!-- Selected Variables -->
    <div class="group-components-vertical">
      <div class="variable-filter-container">
        <app-variable-filter-selection
        [selectedNode]="selectedNode"
        (filtersChange)="onFilterChange($event)"
      ></app-variable-filter-selection>
      </div>

    <!-- Distribution Graph Panel -->
      <div class="histogam-placeholder">
        <section class="distribution-graph" title="Distribution Graph">
          <p>Distribution Graph</p>
          @if (isLoadingHistogram()) {
            <app-loading-spinner></app-loading-spinner>
          } @else if (!selectedNode) {
            <div class="no-data-message">
              <h3> Please select a Variable</h3>
            </div>
            }
          <app-distribution-graph
            [data]="distributionData()"
          ></app-distribution-graph>
        </section>
      </div>
    </div>
  </div>
</app-accordion>
