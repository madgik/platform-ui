<div class="accordion">
  <div class="accordion-header" (click)="toggleAccordion('variables')">
    <span>Variables Panel</span>
    <i class="fas fa-chevron-down"></i>
  </div>
  <div class="accordion-content" [ngClass]="{'open': isAccordionOpen('variables')}">
    <h3>Select Variable</h3>
    <ul>
      <li *ngFor="let variable of variables">
        <button (click)="selectVariable(variable)">{{ variable }}</button>
      </li>
    </ul>
  </div>
</div>
