<div class="search-container">
  <div class="search-input-container">
    <input
      type="text"
      id="search-bar"
      placeholder="Search..."
      [(ngModel)]="searchQuery"
      (focus)="onSearchFocus()"
      (input)="handleSearch(searchQuery)"
    />
    <!-- Inline Filters -->
    <div class="inline-filters">
      <select [(ngModel)]="filterType" (change)="applyFilter(filterType)">
        <option value="variables">Variables</option>
        <option value="groups">Groups</option>
      </select>
      <div *ngIf="filterType === 'variables'" class="additional-filter">
        <select
          [(ngModel)]="variableTypeFilter"
          (change)="applyVariableTypeFilter(variableTypeFilter)"
        >
          <option value="">All Types</option>
          <option *ngFor="let type of variableTypes" [value]="type">
            {{ type }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <!-- Search Suggestions -->
  @if (searchSuggestionsVisible) {
  <div class="suggestions-container">
    @if (filteredItems.length > 0) {
    <div>
      <ul>
        <li
          *ngFor="let item of filteredItems"
          (click)="onItemClick(item)"
          [title]="generateTooltip(item)"
        >
          <strong>{{ item.name || item }}</strong>
        </li>
      </ul>
    </div>
    } @else {

    <!-- No Results Message -->
    <ng-template #noResults>
      <div class="no-results">No results found</div>
    </ng-template>
    }
  </div>
  }
</div>
