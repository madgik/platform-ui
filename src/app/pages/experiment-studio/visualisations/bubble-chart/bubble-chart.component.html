<div id="chart">
  @if (!error) {

  <svg>
    @for (node of d3Data.children; track node) {
    <g (click)="onNodeClick(node)">
      <circle [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.r"></circle>
      <text>{{ node.name }}</text>
    </g>
    }
  </svg>
  <div></div>
  } @else {
  <div class="error-message">
    {{ error }}
  </div>
  }
</div>
