@if (tableSpec()) {
  @for (table of tableSpec(); track table) {
    <div class="ar-group">
      @if (table.title) {
        <div class="ar-group-title">{{ table.title }}</div>
      }
      <div class="ar-value ar-scroll">
        <table class="ar-table">
          <thead>
            <tr>
              @for (col of table.columns; track col) {
                <th class="ar-th">{{ col }}</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (row of table.rows; track row) {
              <tr>
                @for (cell of row; track cell) {
                  <td class="ar-td">{{ cell }}</td>
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  }
}
