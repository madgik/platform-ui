<div class="accordion">
  <div class="accordion-header" (click)="toggleAccordion('transformations')">
    <span>Transformations Panel</span>
    <i class="fas fa-chevron-down"></i>
  </div>
  <div class="accordion-content" [ngClass]="{'open': isAccordionOpen('transformations')}">
    <h3>Apply a Transformation</h3>
    <ul>
      <li *ngFor="let transformation of transformations">
        <button (click)="applyTransformation(transformation)">{{ transformation }}</button>
      </li>
    </ul>
  </div>
</div>
