<div class="experiment-studio-page full-bleed">
  @if (errorMessage) {
  <div
    class="global-error-banner"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="banner-content">
      <i class="fas fa-exclamation-triangle"></i>
      <span>{{ errorMessage }}</span>
    </div>
    <button type="button" class="banner-close" (click)="dismissError()">
      &times;
    </button>
  </div>
  }

  <div class="studio-inner studio-layout">
    <nav class="studio-sidenav" aria-label="Studio navigation">
      <div class="studio-rail-header">
        <div class="studio-rail-title">Navigation</div>
        <div class="studio-rail-meta">Current model: {{ currentModelLabel }}</div>
      </div>

      <div class="studio-rail-section">
        <div class="studio-rail-section-title">Setup</div>
        <a href="/experiment-studio#variables-top" class="studio-rail-item is-active" aria-current="page">
          <span class="studio-rail-icon"><i class="fas fa-database"></i></span>
          <span class="studio-rail-label">Datasets Selection</span>
        </a>
        <a href="/experiment-studio#data-model-visualization" class="studio-rail-item">
          <span class="studio-rail-icon"><i class="fas fa-microscope"></i></span>
          <span class="studio-rail-label">Pathology Visualization</span>
        </a>
      </div>

      <div class="studio-rail-section">
        <div class="studio-rail-section-title">
          Modeling <span class="studio-rail-optional">(optional)</span>
        </div>
        <a href="/experiment-studio#variables-top" class="studio-rail-item">
          <span class="studio-rail-icon"><i class="fas fa-sliders-h"></i></span>
          <span class="studio-rail-label">Variables &amp; Covariates</span>
        </a>
        <a href="/experiment-studio#distribution-graph" class="studio-rail-item">
          <span class="studio-rail-icon"><i class="fas fa-chart-area"></i></span>
          <span class="studio-rail-label">Distribution Graph</span>
        </a>
        <a href="/experiment-studio#parameters-listing" class="studio-rail-item">
          <span class="studio-rail-icon"><i class="fas fa-sliders"></i></span>
          <span class="studio-rail-label">Parameters</span>
        </a>
      </div>

      <div class="studio-rail-section">
        <div class="studio-rail-section-title">Analysis</div>
        <a href="/experiment-studio#statistics-section" class="studio-rail-item">
          <span class="studio-rail-icon"><i class="fas fa-sigma"></i></span>
          <span class="studio-rail-label">Statistics</span>
        </a>
        <a href="/experiment-studio#algorithm-section" class="studio-rail-item">
          <span class="studio-rail-icon"><i class="fas fa-cogs"></i></span>
          <span class="studio-rail-label">Algorithm</span>
        </a>
      </div>
    </nav>

    <div class="studio-main">
      <button
        class="studio-float-back"
        type="button"
        (click)="onBackToDashboard()"
        [disabled]="isRunning()"
        aria-label="Back to Dashboard"
      >
        <i class="fas fa-arrow-left"></i>
        <span>Dashboard</span>
      </button>

      <!-- TOP: Variables -->
      <section class="studio-section studio-section--variables">
        <app-variables-panel></app-variables-panel>
      </section>

      <section class="studio-section studio-section--statistics" id="statistics-section">
        <app-statistic-analysis-panel></app-statistic-analysis-panel>
      </section>

      <!-- BOTTOM: Algorithm -->
      <section class="studio-section studio-section--algorithm" id="algorithm-section">
        <app-algorithm-panel></app-algorithm-panel>
      </section>
    </div>
  </div>


  @if (isRunning()) {
  <div class="global-overlay-loader">
    <app-spinner text="Running analysis..." color="#007d7d" size="72px" />
  </div>
  }
</div>
