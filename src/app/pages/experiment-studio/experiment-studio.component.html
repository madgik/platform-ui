<div class="experiment-studio-page full-bleed">
  @if (errorMessage) {
  <div
    class="global-error-banner"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="banner-content">
      <i class="fas fa-exclamation-triangle"></i>
      <span>{{ errorMessage }}</span>
    </div>
    <button type="button" class="banner-close" (click)="dismissError()">
      &times;
    </button>
  </div>
  }

  <div class="studio-inner studio-layout">
    <nav class="studio-sidenav" aria-label="Studio sections">
      <div class="studio-flow-header">
        <div class="studio-flow-title">Setup progress</div>
        <div class="studio-flow-meta">Step 1 / 6</div>
        <div class="studio-flow-bar">
          <span class="studio-flow-bar-fill" style="width: 16%;"></span>
        </div>
      </div>

      <a href="/experiment-studio#variables-top" class="studio-step current">
        <span class="studio-step-dot"></span>
        <span class="studio-step-label">Datasets Selection</span>
      </a>
      <a href="/experiment-studio#data-model-visualization" class="studio-step upcoming">
        <span class="studio-step-dot"></span>
        <span class="studio-step-label">Pathology Visualization</span>
      </a>
      <a href="/experiment-studio#distribution-graph" class="studio-step upcoming">
        <span class="studio-step-dot"></span>
        <span class="studio-step-label">Distribution Graph</span>
      </a>
      <a href="/experiment-studio#parameters-listing" class="studio-step upcoming">
        <span class="studio-step-dot"></span>
        <span class="studio-step-label">Parameters</span>
      </a>
      <a href="/experiment-studio#statistics-section" class="studio-step upcoming">
        <span class="studio-step-dot"></span>
        <span class="studio-step-label">Statistics</span>
      </a>
      <a href="/experiment-studio#algorithm-section" class="studio-step upcoming">
        <span class="studio-step-dot"></span>
        <span class="studio-step-label">Algorithm</span>
      </a>
    </nav>

    <div class="studio-main">
      <button
        class="studio-float-back"
        type="button"
        (click)="onBackToDashboard()"
        [disabled]="isRunning()"
        aria-label="Back to Dashboard"
      >
        <i class="fas fa-arrow-left"></i>
        <span>Dashboard</span>
      </button>

      <!-- TOP: Variables -->
      <section class="studio-section studio-section--variables">
        <app-variables-panel></app-variables-panel>
      </section>

      <section class="studio-section studio-section--statistics" id="statistics-section">
        <app-statistic-analysis-panel></app-statistic-analysis-panel>
      </section>

      <!-- BOTTOM: Algorithm -->
      <section class="studio-section studio-section--algorithm" id="algorithm-section">
        <app-algorithm-panel></app-algorithm-panel>
      </section>
    </div>
  </div>


  @if (isRunning()) {
  <div class="global-overlay-loader">
    <app-spinner text="Running analysis..." color="#007d7d" size="72px" />
  </div>
  }
</div>
