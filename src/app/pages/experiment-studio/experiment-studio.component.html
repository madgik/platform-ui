<div class="experiment-studio-page full-bleed">
  @if (errorMessage) {
  <div
    class="global-error-banner"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="banner-content">
      <i class="fas fa-exclamation-triangle"></i>
      <span>{{ errorMessage }}</span>
    </div>
    <button type="button" class="banner-close" (click)="dismissError()">
      &times;
    </button>
  </div>
  }

  <header class="studio-header">
    <div>
      <h1 class="studio-title">Experiment Studio</h1>
      <p class="studio-subtitle">
        Select your variables, configure an algorithm and explore the results.
      </p>
    </div>

    <div class="studio-header-actions">
      <button
        class="studio-header-btn"
        type="button"
        (click)="onBackToDashboard()"
        [disabled]="isRunning()"
      >
        <i class="fas fa-arrow-left"></i>
        <span>Back to Dashboard</span>
      </button>
    </div>
  </header>

    <!-- TOP: Variables -->
    <section class="studio-section studio-section--variables">
      <app-variables-panel></app-variables-panel>
    </section>
    <section class="studio-section studio-section--variables">
      <app-statistic-analysis-panel></app-statistic-analysis-panel>
    </section>

    <!-- BOTTOM: Algorithm -->
    <section class="studio-section studio-section--algorithm">
      <app-algorithm-panel></app-algorithm-panel>
    </section>


  @if (isRunning()) {
  <div class="global-overlay-loader">
    <app-spinner text="Running analysis..." color="#007d7d" size="72px" />
  </div>
  }
</div>
