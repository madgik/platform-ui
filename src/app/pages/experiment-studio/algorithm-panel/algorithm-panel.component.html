<div class="accordion">
  <div class="accordion-header" (click)="toggleAccordion('algorithm')">
    <span>Algorithm Panel</span>
    <i class="fas fa-chevron-down"></i>
  </div>
  <div class="accordion-content" [ngClass]="{'open': isAccordionOpen('algorithm')}">
    <h3>Configure Algorithm</h3>
    <ul>
      <li *ngFor="let algorithm of algorithms">
        <button (click)="configureAlgorithm(algorithm)">{{ algorithm }}</button>
      </li>
    </ul>
  </div>
</div>
