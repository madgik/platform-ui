<app-accordion [accordionTitle]=accordionTitle>
  <div class="accordion-content">
    <h3>Configure Algorithm</h3>
    <ul>
      @for (algorithm of algorithms; track algorithm){
        <li>
          <button (click)="configureAlgorithm(algorithm)">{{ algorithm }}</button>
        </li>
      }
    </ul>
  </div>
</app-accordion>
