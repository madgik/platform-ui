<div class="p-4 space-y-6">

  <!-- Custom structured renderer -->
  @if (isRenderable()) {
    <app-auto-renderer [value]="result" [algorithm]="algorithm"/>
  }

  <!-- Charts -->
  @if (renderedCharts().length > 0) {
    <section class="space-y-6">
      <h3 class="text-sm font-semibold text-gray-700">Generated Charts</h3>
      <app-chart-renderer [charts]="renderedCharts()" />
    </section>
  }

  <!-- Raw fallback -->
  <details class="text-xs text-gray-500 mt-4">
    <summary class="cursor-pointer">View Raw JSON</summary>
    <pre class="bg-gray-100 rounded p-2 overflow-auto">
      {{ result | json }}
    </pre>
  </details>

  <!-- Export button -->
  <button
    (click)="exportToPDF()"
    class="mt-4 px-4 py-2 rounded bg-black text-white"
  >
    Export as PDF
  </button>
</div>
