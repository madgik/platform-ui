<div class="workflow">
  <div class="step" [ngClass]="{ 'completed': currentStep >= 1, 'active': currentStep === 1 }">
    1. Variable
    <div class="details" *ngIf="currentStep >= 1 && variableName">Selected: {{ variableName }}</div>
  </div>
  <div class="connector" [ngClass]="{ 'completed': currentStep >= 2 }">&#x279E;</div>
  <div class="step" [ngClass]="{ 'completed': currentStep >= 2, 'active': currentStep === 2 }">
    2. Transformation
    <div class="details" *ngIf="currentStep >= 2 && transformationName">Applied: {{ transformationName }}</div>
  </div>
  <div class="connector" [ngClass]="{ 'completed': currentStep >= 3 }">&#x279E;</div>
  <div class="step" [ngClass]="{ 'completed': currentStep >= 3, 'active': currentStep === 3 }">
    3. Filter
    <div class="details" *ngIf="currentStep >= 3 && filterName">Used: {{ filterName }}</div>
  </div>
  <div class="connector" [ngClass]="{ 'completed': currentStep >= 4 }">&#x279E;</div>
  <div class="step" [ngClass]="{ 'completed': currentStep >= 4, 'active': currentStep === 4 }">
    4. Algorithm
  </div>
  <div class="connector" [ngClass]="{ 'completed': currentStep >= 5 }">&#x279E;</div>
  <div class="step" [ngClass]="{ 'completed': currentStep >= 5, 'active': currentStep === 5 }">
    5. Results
  </div>
</div>
