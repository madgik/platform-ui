<header class="header header--transparent">
  <!-- Logo -->
  <a class="branding" routerLink="/experiments-dashboard" (click)="goHome($event)" aria-label="Go to home">
    <img src="assets/mip-logo-short.png" alt="MIP Logo" class="logo" />
  </a>
  <!-- Navbar (Removed to maximize space) -->

  <!-- Theme Toggle + User Icon -->
  <div class="header-actions">
    <button class="theme-toggle-btn" (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (themeService.isDark()) {
      <!-- Sun Icon (Lucide-like) -->
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      } @else {
      <!-- Moon Icon (Lucide-like) -->
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      }
    </button>
    <div class="user-icon">
      @if (isLoggedIn()) {
      <!-- LOGGED IN: go to account -->
      <a class="sign-in-btn" routerLink="/account">
        <img src="assets/user-icon.png" alt="User Picture" class="account-picture" />
      </a>
      } @else {
      <!-- LOGGED OUT: trigger login -->
      <button class="sign-in-btn" (click)="login()">
        <img src="assets/grey-avatar.png" alt="Sign In" class="account-picture" />
      </button>
      }
    </div>
  </div>
</header>
