<header class="header">
  <!-- Logo -->
  <div class="branding">
    <img src="assets/logo.png" alt="Platform Logo" class="logo" />
    <div class="branding-text">
      <!-- <h1>Medical Informatics Platform</h1> -->
    </div>
  </div>
  <!-- Navbar -->
  <div class="navbar-wrapper">
    <app-navbar></app-navbar>
  </div>
  <!-- User Icon -->
  <div class="user-icon">
    @if (isLoggedIn()) {
      <!-- LOGGED IN: go to account -->
      <a class="sign-in-btn" routerLink="/account">
        <img
          src="assets/user-icon.png"
          alt="User Picture"
          class="account-picture"
        />
      </a>
    } @else {
      <!-- LOGGED OUT: trigger login -->
      <button class="sign-in-btn" (click)="login()">
        <img
          src="assets/grey-avatar.png"
          alt="Sign In"
          class="account-picture"
        />
      </button>
    }
  </div>
</header>
