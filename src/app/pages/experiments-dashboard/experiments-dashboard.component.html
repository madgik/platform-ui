<div class="experiments-dashboard">
  <div class="main-content">
    <!-- Top section with a button to create new experiments -->
    <div class="top-section">
      <h1>Experiments Dashboard</h1>
    </div>

    <!-- Content section with experiment list and details -->
    <div class="content-body">
      <!-- Experiment menu with a dynamic list of experiments -->
      <div class="experiment-menu">
        <app-experiments-list
          (experimentSelected)="onExperimentSelected($event)"
          (isAddingExperiment)="onAddExperiment()"
        ></app-experiments-list>
      </div>

      @if (isAddingExperiment) {
      <app-new-experiment (cancel)="onCloseNewExperiment()" />
      }
      <!-- Experiment Details -->
      @if (selectedExperiment()) {
        <app-experiment-details
          [selectedExperiment]="selectedExperiment()"
          (deleteExperiment)="onDeleteRequested()"
        ></app-experiment-details>
      }

      <!-- Delete Confirmation Modal -->
      @if (isConfirmingDelete) {
      <div class="modal-overlay" (click)="cancelDelete()">
        <div class="modal-container" (click)="$event.stopPropagation()">
          <p>Are you sure you want to delete this experiment?</p>
          <div class="dialog-actions">
            <button type="button" class="btn-create" (click)="confirmDelete(selectedExperiment()?.id ?? 'No experiment id')">
              OK
            </button>
            <button type="button" class="btn-cancel" (click)="cancelDelete()">
              Cancel
            </button>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</div>
