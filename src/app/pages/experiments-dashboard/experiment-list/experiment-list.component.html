<div class="experiment-sidebar">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <h2 class="sidebar-title">Experiments</h2>
  </div>

  <!-- Experiment List (Collapsible) -->
  <div class="sidebar-section">
    <a (click)="toggleMenu()" class="toggle-menu">
      <i class="fas fa-flask"></i>
      <span>Experiment List</span>
      <i [class]="menuExpanded ? 'fas fa-chevron-up' : 'fas fa-chevron-down'"></i>
    </a>
    @if(menuExpanded) {
      <ul class="nested-experiment-list">
        @for (experiment of experimentsService.experiments(); track experiment) {
          <li (click)="selectExperiment(experiment)">
            <i class="fas fa-vial"></i>
            <span>{{ experiment.name }}</span>
          </li>
        }
        @empty {
          <div class="sidebar-section">
            <p>No experiments yet!</p>
          </div>
        }
      </ul>
    }
  </div>


  <!-- Static Menu Items -->
  <ul class="static-menu">
    @for (item of experimentMenuItems; track item) {
      <li>
        <a (click)="onMenuItemClick(item)"> <!-- </a>[routerLink]="item.route"> -->
          <i [class]="item.icon"></i> <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</div>
