<div class="modal-overlay" (click)="closeModal()"></div>
<dialog open>
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>New Experiment</h2>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>
    <form (ngSubmit)="onCreateExperiment()">
      <div class="modal-body">
        <label for="experimentName">Experiment Name *</label>
        <input
          id="experimentName"
          type="text"
          name="experimentName"
          placeholder="Enter experiment name"
          [(ngModel)]="experimentName"
          required
        />

        <label for="experimentDescription">Experiment Description *</label>
        <textarea
          id="experimentDescription"
          name="experimentDescription"
          placeholder="Provide a brief description of the experiment"
          [(ngModel)]="description"
          required
        ></textarea>

        <label for="dateCreated">Date Created</label>
        <input
          id="dateCreated"
          type="date"
          name="dateCreated"
          [(ngModel)]="date"
          readonly
        />

        <label for="status">Status</label>
        <input
          id="status"
          type="text"
          name="status"
          [(ngModel)]="status"
          readonly
        />
      </div>
      <div class="dialog-actions">
        <button type="submit" class="btn-create" (click)="onCreateExperiment()">Create Experiment</button>
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</dialog>
