<div class="modal-overlay" (click)="closeModal()"></div>
<dialog open>
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>New Experiment</h2>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <label for="experimentName">Experiment Name</label>
      <input type="text" id="experimentName" placeholder="Enter experiment name" />

      <label for="experimentDescription">Experiment Description</label>
      <textarea id="experimentDescription" placeholder="Provide a brief description of the experiment"></textarea>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
      <button type="button" class="btn-create" (click)="onCreateExperiment()">Create Experiment</button>
    </div>
  </div>
</dialog>
